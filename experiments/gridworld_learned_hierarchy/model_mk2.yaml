---
env: "../../mdm/gridworld/8x8_v0.mapdata"
neptune_cfg: "../neptune_settings.yaml"
train_samples: "gridworld_train.samples"
test_samples: "gridworld_test.samples"
checkpoint_path: 'checkpoints'
final_model_path: 'model.ptmdl'

# model in general
mdm:
  abstract_step_size: 5
  beta_kl_primitive: 0.01
  beta_reg_primitive: 0.01
  beta_kl_abstract: 0.01
  beta_reg_abstract: 0.01
  detach_posteriors: False

prim_mdl:
  d_state: 32
  d_hidden: 64
  n_hidden_layers: 2
  hidden_dropout: 0.1
  epsilon: 0.1
  s_prior_lws: [128, 128]
  s_post_lws: [128, 128]
  o_lws: [64, 32, 16]
  r_lws: [64, 32, 16]
  term_lws: [64, 32, 16]
  layer_norm: True
  activation: "gelu"
  rnn_type: "lstm"

abstr_mdl:
  d_state: 64
  d_hidden: 128
  d_action: 4
  d_reward: 1
  n_hidden_layers: 1
  hidden_dropout: 0.1
  epsilon: 0.1
  s_prior_lws: [256, 256]
  s_post_lws: [256, 256]
  r_lws: [128, 64, 32]
  term_lws: [128, 64, 32]
  layer_norm: True
  activation: "gelu"
  rnn_type: "lstm"

abstr_act_mdl:
  lws: [64, 32]
  activation: "gelu"
  layer_norm: True

optim:
  lr: 0.003

trainer:
  n_warmup_steps: 1
  n_train_steps: 10000
  eval_interval: 200
  d_batch: 1024
  pad_last_terminal_flag: False
