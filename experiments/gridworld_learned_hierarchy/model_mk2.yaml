---
env: "../../mdm/gridworld/8x8_v0.mapdata"
neptune_cfg: "../neptune_settings.yaml"
train_samples: "gridworld_train.samples"
test_samples: "gridworld_test.samples"
checkpoint_path: "checkpoints"
final_model_path: "model"

# model in general
mdm:
  abstract_step_size: 5
  beta_kl_primitive: 0.1
  beta_reg_primitive: 0.0000
  beta_kl_abstract: 0.1
  beta_reg_abstract: 0.0000
  n_warmup_prim: 3
  n_warmup_abstr: 1
  detach_posteriors: False
  beta_abstract_action: 0.0
  beta_abstract_model: 1.0

prim_mdl:
  d_state: 16
  d_hidden: 64
  n_hidden_layers: 2
  hidden_dropout: 0.1
  epsilon: 0.01
  s_prior_lws: [32, 32]
  s_post_lws: [32, 32]
  o_lws: [32, 32]
  r_lws: [32, 32]
  term_lws: [32, 32]
  layer_norm: True
  activation: "relu"
  rnn_type: "lstm"

abstr_mdl:
  d_state: 32
  d_hidden: 128
  d_action: 3
  d_reward: 1
  n_hidden_layers: 2
  hidden_dropout: 0.1
  epsilon: 0.01
  s_prior_lws: [128, 128]
  s_post_lws: [128, 128]
  o_lws: [128, 64]
  r_lws: [128, 64]
  term_lws: [128, 64]
  layer_norm: True
  activation: "relu"
  rnn_type: "lstm"

abstr_act_mdl:
  lws: [64, 64]
  activation: "relu"
  layer_norm: True

optim:
  lr: 0.003

trainer:
  n_warmup_steps: 3
  n_train_steps: 10000
  eval_interval: 50
  d_batch: 2048
  pad_last_terminal_flag: False
