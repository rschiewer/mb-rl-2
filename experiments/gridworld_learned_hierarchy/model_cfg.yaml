---
env: "../../mdm/gridworld/8x8_v0.mapdata"
neptune_cfg: "../neptune_settings.yaml"
train_samples: "gridworld_train.samples"
test_samples: "gridworld_test.samples"
checkpoint_path: "checkpoints"
final_model_path: "model"

# model in general
mdm:
  abstract_step_size: 3
  beta_kl_primitive: 0.5 #0.005
  beta_reg_primitive: 0.01 #0.005
  beta_kl_abstract: 0.5 #0.005
  beta_reg_abstract: 0.01 #0.001
  n_warmup_prim: 3
  n_warmup_abstr: 1
  detach_posteriors: False
  beta_abstract_action: 0.0
  beta_abstract_model: 1.0
  abstract_pred_target: "prim_z"

prim_mdl:
  d_z: 16
  d_h: 32
  d_state: -1
  n_hidden_layers: 2
  hidden_dropout: 0.1
  epsilon: 0.1
  z_prior_lws: [64, 64]
  z_post_lws: [64, 64]
  state_lws: []
  o_lws: [64, 64]
  r_lws: [64, 64]
  term_lws: [64, 64]
  layer_norm: True
  activation: "relu"
  rnn_type: "gru"

abstr_mdl:
  d_z: 128
  d_h: 256
  d_state: -1
  d_action: 6
  d_reward: 1
  n_hidden_layers: 6
  hidden_dropout: 0.1
  epsilon: 0.1
  z_prior_lws: [128, 64]
  z_post_lws: [128, 64]
  state_lws: []
  o_lws: [128, 128, 64]
  r_lws: [128, 128, 64]
  term_lws: [128, 128, 64]
  layer_norm: True
  activation: "relu"
  rnn_type: "gru"

abstr_act_mdl:
  lws: [128, 128]
  activation: "relu"
  layer_norm: True

optim:
  lr: 0.0005 #0.0002

trainer:
  n_train_steps: 12000
  eval_interval: 100
  d_batch: 2048
  pad_last_terminal_flag: False
