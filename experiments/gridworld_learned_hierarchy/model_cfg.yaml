---
env: "../../mdm/gridworld/8x8_v0.mapdata"
neptune_cfg: "../neptune_settings.yaml"
train_samples: "gridworld_v1_train.samples"
test_samples: "gridworld_v0_good_trajectories.samples"
checkpoint_path: "checkpoints"
final_model_path: "model"

# model in general
mdm:
  abstract_step_size: 3
  beta_kl_primitive: 1.0 #0.005
  beta_reg_primitive: 0.0 #0.005
  beta_kl_abstract: 1.0 #0.005
  beta_reg_abstract: 0.0 #0.001
  n_warmup_prim: -1
  n_warmup_abstr: -1
  detach_posteriors: False
  beta_abstract_action: 0.0
  beta_abstract_model: 1.0
  abstract_pred_target: "prim_h"

prim_mdl:
  d_z: 2
  d_h: 32
  n_hidden_layers: 2
  hidden_dropout: 0.1
  epsilon: 0.01
  z_prior_lws: [64, 64]
  z_post_lws: [64, 64]
  o_lws: [64, 64]
  r_lws: [64, 64]
  term_lws: [64, 64]
  layer_norm: True
  activation: "relu"
  rnn_type: "gru"
  stochastic_outputs: True

abstr_mdl:
  d_z: 3
  d_h: 256
  d_a: 4
  d_r: 1
  n_hidden_layers: 1
  hidden_dropout: 0.1
  epsilon: 0.01
  z_prior_lws: [128, 128]
  z_post_lws: [128, 128]
  o_lws: [128, 128]
  r_lws: [128, 128]
  term_lws: [128, 128]
  layer_norm: True
  activation: "relu"
  rnn_type: "gru"
  stochastic_outputs: True

abstr_act_mdl:
  lws: [32, 32]
  activation: "relu"
  layer_norm: True
  distribution_type: "normal"

optim:
  type: 'adam'  #'adamW'
  lr: 0.0002 #0.0002

trainer:
  n_train_steps: 10000
  eval_interval: 100
  d_batch: 2048
  pad_last_terminal_flag: False

eval:
  n_warmup_prim: 3
  n_warmup_abstr: 1