---
env: "../../mdm/gridworld/8x8_v0.mapdata"
neptune_cfg: "../neptune_settings.yaml"
train_samples: "gridworld_train.samples"
test_samples: "gridworld_test.samples"
checkpoint_path: "checkpoints"
final_model_path: "model"

# model in general
mdm:
  abstract_step_size: 3
  beta_kl_primitive: 0.01
  beta_reg_primitive: 0.01
  beta_kl_abstract: 0.01
  beta_reg_abstract: 0.01
  n_warmup_prim: 3
  n_warmup_abstr: 1
  detach_posteriors: False
  beta_abstract_action: 0.0
  beta_abstract_model: 1.0

prim_mdl:
  d_z: 16
  d_h: 64
  d_state: 16
  n_hidden_layers: 3
  hidden_dropout: 0.1
  epsilon: 0.01
  z_prior_lws: [64, 64]
  z_post_lws: [64, 64]
  state_lws: [64, 32]
  o_lws: [32, 64]
  r_lws: [32, 64]
  term_lws: [32, 64]
  layer_norm: True
  activation: "relu"
  rnn_type: "lstm"

abstr_mdl:
  d_z: 64
  d_h: 256
  d_state: 64
  d_action: 6
  d_reward: 1
  n_hidden_layers: 3
  hidden_dropout: 0.1
  epsilon: 0.01
  z_prior_lws: [128, 64]
  z_post_lws: [128, 64]
  state_lws: [128]
  o_lws: [128, 64]
  r_lws: [128, 64]
  term_lws: [128, 64]
  layer_norm: True
  activation: "relu"
  rnn_type: "lstm"

abstr_act_mdl:
  lws: [64, 64]
  activation: "relu"
  layer_norm: True

optim:
  lr: 0.0002

trainer:
  n_train_steps: 20000
  eval_interval: 100
  d_batch: 2048
  pad_last_terminal_flag: False
