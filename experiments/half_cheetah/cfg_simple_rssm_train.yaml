---
neptune_cfg: "../neptune_settings.yaml"
env_name: "HalfCheetah-v4" #"gym_nav2d:nav2dEasy-v0" # "gym_nav2d:nav2dVeryEasy-v0"
prefill_memory: "random" #"offline-dataset" # "random", False
prefill_episodes: 100
train_samples: null
test_samples: null
checkpoint_path: "checkpoints"
final_model_path: "trained_models/model"
pretrained_model: null #"MBRL-2908"
repeat_terminal_state: False

mdm:
   rssm_modules:
      # RSSM no. 1
      -  d_z: 20
         d_h: 200
         d_a: <infer>
         n_hidden_layers: 1
         hidden_dropout: 0.1
         epsilon: 0.1
         z_prior_lws: [ 128, 128 ]
         z_post_lws: [ 128, 128 ]
         layer_norm: True
         activation: "relu"
         rnn_type: "lstm"
         latent_dist: "normal"  #"normal" "categorical" "bernoulli"
         o_encoder:
            class: "MLPEncoder"
            d_x_encoded: 32
            lws: [ 128, 128 ]
            layer_norm: True
            activation: "relu"
         o_decoder:
            class: "GaussianDecoder"
            lws: [ 128, 128 ]
            layer_norm: True
            activation: "relu"
            epsilon: 0.1
         r_decoder:
            class: "GaussianDecoder"
            lws: [ 128, 128 ]
            layer_norm: True
            activation: "relu"
            epsilon: 0.1
         term_decoder:
            class: "BinomialDecoder"
            lws: [ 128, 128 ]
            layer_norm: True
            activation: "relu"
   links: []  # Links for observation filters between RSSM levels
   upwards_filters: []
   warmup_steps: [ 'rand' ]
   kl_betas: [ 1.0 ] # [ 0.1 ]
   kl_reg_betas: [ 0.0 ]
   ema_regularization: 0.0
   ema_coeff: 0.95
   ema_update_interval: 10
   latent_overshooting: [ 5 ]
   temporal_activation_regularization: 0.0
   kl_balance: 0.8

optim:
   type: 'adam'  # 'adamW' 'adam'
   lr: 0.0002 #0.0002

trainer:
   n_train_steps: 30000
   freeze_model: False
   stop_collect: False
   eval_interval: 100
   d_batch: 64
   subtrajectory_len: 50
   collect_envs: 10
   collect_interval: 100
   agent_train_interval: 1
   model_train_steps: [ -1 ]
   agent_model_steps: [ 15 ]
   checkpoint_interval: 100

agents:
   r_max:
      # level 0
      - eps_exploration_init: 0.9
        eps_exploration_coeff: 0.999
        eps_exploration_min: 0.3
        act_entropy_exploration_coeff: 0.01
        learn_act_entropy_exploration_coeff: False
        novelty_exploration_coeff: 0.05
        tr_policy_kl_coeff: 0.05
        tr_policy_ema_update_coeff: 0.98
        use_ema_world_model: False
        lr_actor: 0.0002
        lr_critic: 0.0008
        min_a: <infer>
        max_a: <infer>
        actor_lws: [ 200, 100, 100 ]
        critic_lws: [ 200, 100, 100 ]
        actor_act_fn: "elu"
        critic_act_fn: "elu"
        actor_layer_norm: True
        critic_layer_norm: True
        normalize_observations: 'running_average'
        normalize_rewards: 'running_average'

eval:
   eval_envs: 20
   eval_steps: 1000
