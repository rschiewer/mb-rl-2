---
neptune_cfg: "../neptune_settings.yaml"
train_samples: "nav2d_VeryEasy_train.samples"
test_samples: "nav2d_VeryEasy_expert.samples"
checkpoint_path: "checkpoints"
final_model_path: "trained_models/model"

# model in general
mdm:
  abstract_step_size: 2
  beta_kl_primitive: 1.0 #0.005
  beta_reg_primitive: 0.000 #0.005
  beta_kl_abstract: 1.0 #0.005
  beta_reg_abstract: 0.000 #0.001
  beta_sched_stay: 1500
  beta_sched_rise: 1500
  n_warmup_prim: -1
  n_warmup_abstr: -1
  detach_posteriors: False
  latent_overshooting: True
  overshooting_stride: 4
  beta_abstract_action: 0.0
  beta_abstract_model: 0.0
  abstract_pred_target: "prim_o"

prim_mdl:
  d_z: 3
  d_h: 64
  n_hidden_layers: 3
  hidden_dropout: 0.1
  epsilon: 1.0
  z_prior_lws: [64, 64, 64]
  z_post_lws: [64, 64, 64]
  layer_norm: True
  activation: "relu"
  rnn_type: "lstm"
  latent_dist: "normal"  #"normal" #"categorical" #"bernoulli"
  stochastic_outputs: True

prim_o_enc:
  lws: [32]
  layer_norm: True
  activation: "relu"
  d_x_encoded: 32

prim_o_dec:
  lws: [32, 32]
  layer_norm: True
  activation: "relu"
  epsilon: 1.0

prim_r_dec:
  lws: [32, 32]
  layer_norm: True
  activation: "relu"
  epsilon: 0.00001

prim_term_dec:
  lws: [32, 32]
  layer_norm: False
  activation: "relu"

abstr_mdl:
  d_z: 3
  d_h: 32
  d_a: 4
  n_hidden_layers: 1
  hidden_dropout: 0.1
  epsilon: 1.0
  z_prior_lws: [64]
  z_post_lws: [64]
  layer_norm: True
  activation: "relu"
  rnn_type: "lstm"
  latent_dist: "normal"
  stochastic_outputs: True

abstr_o_enc:
  lws: [32]
  layer_norm: True
  activation: "relu"
  d_x_encoded: 32

abstr_o_dec:
  lws: [32]
  layer_norm: True
  activation: "relu"
  epsilon: 0.0001

abstr_r_dec:
  lws: [32]
  layer_norm: True
  activation: "relu"
  epsilon: 0.0001

abstr_term_dec:
  lws: [32]
  layer_norm: True
  activation: "relu"

abstr_act_mdl:
  lws: [32]
  activation: "relu"
  layer_norm: True
  model_type: "det_tanh"

optim:
  type: 'adamW'  #'adamW'
  lr: 0.001 #0.0002

trainer:
  n_train_steps: 8000
  eval_interval: 100
  d_batch: 256
  pad_last_terminal_flag: False
  subtrajectory_len: 0

eval:
  n_warmup_prim: 2
  n_warmup_abstr: 1
