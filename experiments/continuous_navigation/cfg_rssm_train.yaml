---
neptune_cfg: "../neptune_settings.yaml"
train_samples: "nav2d_VeryEasy_train.samples"
test_samples: "nav2d_VeryEasy_expert.samples"
checkpoint_path: "checkpoints"
final_model_path: "trained_models/model"

mdm:
   rssm_modules:
      # RSSM no. 1
      -  d_z: 3
         d_h: 64
         n_hidden_layers: 1
         hidden_dropout: 0.1
         epsilon: 1.0
         z_prior_lws: [ 64, 64 ]
         z_post_lws: [ 64, 64 ]
         layer_norm: True
         activation: "relu"
         rnn_type: "lstm"
         latent_dist: "normal"  #"normal" "categorical" "bernoulli"
         stochastic_outputs: True
         o_encoder:
            class: "MLPEncoder"
            d_x_encoded: 32
            lws: [ 32 ]
            layer_norm: True
            activation: "relu"
         o_decoder:
            class: "GaussianDecoder"
            lws: [ 32, 32 ]
            layer_norm: True
            activation: "relu"
            epsilon: 0.001
         r_decoder:
            class: "GaussianDecoder"
            lws: [ 32, 32 ]
            layer_norm: True
            activation: "relu"
            epsilon: 0.001
         term_decoder:
            class: "BinomialDecoder"
            lws: [ 32, 32 ]
            layer_norm: True
            activation: "relu"
      # RSSM no. 2
      -  d_z: 3
         d_h: 64
         d_a: 2
         n_hidden_layers: 1
         hidden_dropout: 0.1
         epsilon: 1.0
         z_prior_lws: [ 64, 64 ]
         z_post_lws: [ 64, 64 ]
         layer_norm: True
         activation: "relu"
         rnn_type: "lstm"
         latent_dist: "normal"  #"normal" "categorical" "bernoulli"
         stochastic_outputs: True
         o_encoder:
            class: "MLPEncoder"
            lws: [ 32 ]
            layer_norm: True
            activation: "relu"
            d_x_encoded: 32
         o_decoder:
            class: "GaussianDecoder"
            lws: [ 32, 32 ]
            layer_norm: True
            activation: "relu"
            epsilon: 0.001
         r_decoder:
            class: "GaussianDecoder"
            lws: [ 32, 32 ]
            layer_norm: True
            activation: "relu"
            epsilon: 0.001
         term_decoder:
            class: "BinomialDecoder"
            lws: [ 32, 32 ]
            layer_norm: True
            activation: "relu"
   links: [ 'z' ]
   upwards_filters:
      -  o:
            class: "PickOneUpwardsFilter"
            window_size: 2
            offset: -1
         a:
            class: "LearnableUpwardsFilter"
            window_size: 2
            lws: [ 32, 32 ]
            layer_norm: True
            activation: "relu"
            model_type: "det_tanh"
         r:
            class: "AvgUpwardsFilter"
            window_size: 2
         term:
            class: "MaxUpwardsFilter"
            window_size: 2
   warmup_steps: [ 'rand', 'rand' ]
   kl_betas: [ 1.0, 1.0 ]

optim:
   type: 'adamW'  # 'adamW' 'adam'
   lr: 0.001 #0.0002

trainer:
   n_train_steps: 2000
   eval_interval: 100
   d_batch: 256
   pad_last_terminal_flag: False
   subtrajectory_len: 0

eval:
   n_warmup_prim: 2
   n_warmup_abstr: 1
