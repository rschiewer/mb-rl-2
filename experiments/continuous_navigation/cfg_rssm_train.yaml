---
neptune_cfg: "../neptune_settings.yaml"
env_name: "gym_nav2d:nav2dEasySparse-v0"#"PointMaze_UMaze_static-v3" #"HalfCheetah-v4" #"PointMaze_UMaze-v3" #"InvertedPendulum-v4"# "gym_nav2d:nav2dEasySparse-v0" #"gym_nav2d:nav2dEasy-v0" # "gym_nav2d:nav2dVeryEasy-v0"
prefill_memory: "random" #"offline-dataset" # "random", False
prefill_episodes: 10
train_samples: null #"nav2d_Easy_train.samples" #"nav2d_Easy_train.samples"
test_samples: null #"nav2d_EasySparse_expert.samples" #"nav2d_Easy_expert.samples"
checkpoint_path: "checkpoints"
final_model_path: "trained_models/model"
pretrained_model: null #"MBRL-2908"
repeat_terminal_state: False

mdm:
   rssm_modules:
      # RSSM no. 1
      -  d_z: 10
         d_h: 200
         d_a: <infer>
         d_s_embedding: 20
         s_embedding_lws: [128, 64, 64]
         n_hidden_layers: 1
         hidden_dropout: 0.1
         epsilon: 0.1
         z_prior_lws: [ 200 ]
         z_post_lws: [ 200 ]
         layer_norm: True
         activation: "relu"
         rnn_type: "gru"
         latent_dist: "normal"  #"normal" "categorical" "bernoulli"
         n_latent_categories: 16
         o_encoder:
            class: "MLPEncoder"
            d_x_encoded: 64
            lws: [ 100, 100, 100 ]
            layer_norm: True
            activation: "relu"
         o_decoder:
            class: "GaussianDecoder"
            lws: [ 100, 100, 100 ]
            layer_norm: True
            activation: "relu"
            epsilon: 0.1
         r_decoder:
            class: "GaussianDecoder"
            lws: [ 100, 100, 100 ]
            layer_norm: True
            activation: "relu"
            epsilon: 0.1
         term_decoder:
            class: "BinomialDecoder"
            lws: [ 100, 100, 100 ]
            layer_norm: True
            activation: "relu"
      # RSSM no. 2
      -  d_z: 20
         d_h: 200
         d_a: 8
         d_s_embedding: 30
         s_embedding_lws: [128, 64, 64]
         n_hidden_layers: 1
         hidden_dropout: 0.1
         epsilon: 0.1
         z_prior_lws: [ 200 ]
         z_post_lws: [ 200 ]
         layer_norm: True
         activation: "relu"
         rnn_type: "gru"
         latent_dist: "normal"  #"normal" "categorical" "bernoulli"
         o_encoder:
            class: "MLPEncoder"
            lws: [ 100, 100, 100 ]
            layer_norm: True
            activation: "relu"
            d_x_encoded: 32
         o_decoder:
            class: "GaussianDecoder"
            lws: [ 100, 100, 100 ]
            layer_norm: True
            activation: "relu"
            epsilon: 0.1
         r_decoder:
            class: "GaussianDecoder"
            lws: [ 100, 100, 100 ]
            layer_norm: True
            activation: "relu"
            epsilon: 0.1
         term_decoder:
            class: "BinomialDecoder"
            lws: [ 100, 100, 100 ]
            layer_norm: True
            activation: "relu"
   links: [ 's_embedding' ]  # Links for observation filters between RSSM levels
   upwards_filters:
      # Connection between RSSM1 and RSSM2
      -  o:
            class: "PickOneUpwardsFilter"
            window_size: 3
            offset: -1
         #a:
         #   class: "LearnableUpwardsFilter"
         #   window_size: 2
         #   lws: [ 32, 32 ]
         #   layer_norm: True
         #   activation: "relu"
         #   model_type: "det_tanh"
         r:
            class: "AvgUpwardsFilter"  # sum makes resulting reward invariant w.r.t. chunk size for incomplete chunks
            window_size: 3
         terminal:
            class: "MaxUpwardsFilter"
            window_size: 3
         mask:
            class: "MinUpwardsFilter"
            window_size: 3
   warmup_steps: [ 'rand', 'rand' ]
   kl_betas: [ 0.5, 0.5 ]
   kl_reg_betas: [ 0.0, 0.0 ]
   ema_regularization: 0.0
   ema_coeff: 0.95
   ema_update_interval: 10
   latent_overshooting: [ ] #[14, 9]
   temporal_activation_regularization: 0.0
   kl_balance: 0.8

optim:
   type: 'adam'  # 'adamW' 'adam'
   lr: 0.0002 #0.0002

trainer:
   n_train_steps: 6000
   freeze_model: False
   stop_collect: False
   eval_interval: 50
   d_batch: 256
   subtrajectory_len: 50
   collect_envs: 5
   collect_interval: 50
   agent_train_interval: 1
   model_train_steps: [ -1, 15 ]
   agent_model_steps: [ 15, 10 ]
   checkpoint_interval: 100
   sample_model_during_agent_training: True
   sample_agent_during_agent_training: True

agents:
   r_max:
      # level 0
      -  observation_type: 's_embedding'
         eps_exploration_init: 0.9
         eps_exploration_coeff: 0.9999
         eps_exploration_min: 0.05
         min_scale: 0.1
         act_entropy_exploration_coeff: 0.0000
         learn_act_entropy_exploration_coeff: False
         novelty_exploration_coeff: 0.00
         tr_policy_kl_coeff: 0.1
         tr_policy_ema_update_coeff: 0.95
         lr_actor: 0.0001
         lr_critic: 0.0002
         lr_other: 0.00001
         actor_lws: [ 100, 200, 100 ]
         critic_lws: [ 100, 200, 100 ]
         actor_act_fn: "relu"
         critic_act_fn: "relu"
         actor_layer_norm: True
         critic_layer_norm: True
         normalize_observations: False
         normalize_rewards: False
         dynamics_loss: True
         use_slow_value_target: True
         use_slow_world_model: False
      # level 1
      -  observation_type: 's_embedding'
         eps_exploration_init: 0.9
         eps_exploration_coeff: 0.9992
         eps_exploration_min: 0.05
         min_scale: 0.1
         act_entropy_exploration_coeff: 0.0000
         learn_act_entropy_exploration_coeff: False
         novelty_exploration_coeff: 0.00
         tr_policy_kl_coeff: 0.1
         tr_policy_ema_update_coeff: 0.95
         lr_actor: 0.0001
         lr_critic: 0.0002
         lr_other: 0.00001
         actor_lws: [ 100, 200, 100 ]
         critic_lws: [ 100, 200, 100 ]
         actor_act_fn: "relu"
         critic_act_fn: "relu"
         actor_layer_norm: True
         critic_layer_norm: True
         normalize_observations: False
         normalize_rewards: False
         dynamics_loss: True
         use_slow_value_target: True
         use_slow_world_model: False
   goal_seeking:
      # level 0
      -  observation_type: 's_embedding'
         eps_exploration_init: 0.3
         eps_exploration_coeff: 0.999
         eps_exploration_min: 0.05
         min_scale: 0.001
         act_entropy_exploration_coeff: 0.0000
         learn_act_entropy_exploration_coeff: False
         novelty_exploration_coeff: 0.0
         tr_policy_kl_coeff: 0.1
         tr_policy_ema_update_coeff: 0.95
         lr_actor: 0.0001
         lr_critic: 0.0002
         lr_other: 0.00001
         actor_lws: [ 100, 200, 100 ]
         critic_lws: [ 100, 200, 100 ]
         actor_act_fn: "relu"
         critic_act_fn: "relu"
         actor_layer_norm: True
         critic_layer_norm: True
         normalize_observations: False
         normalize_rewards: False
         dynamics_loss: False
         use_slow_value_target: True
         use_slow_world_model: False
eval:
   eval_envs: 20
   eval_steps: 1000
   warmup_steps: [ 3, 3 ]
