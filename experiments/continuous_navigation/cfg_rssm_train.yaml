---
neptune_cfg: "../neptune_settings.yaml"
train_samples: "nav2d_VeryEasy_train.samples"
test_samples: "nav2d_VeryEasy_expert.samples"
checkpoint_path: "checkpoints"
final_model_path: "trained_models/model"

mdm:
   rssm_modules:
      # RSSM no. 1
      -  d_z: 10
         d_h: 64
         d_a: null
         n_hidden_layers: 3
         hidden_dropout: 0.1
         epsilon: 0.00001
         z_prior_lws: [ 64, 64 ]
         z_post_lws: [ 64, 64 ]
         layer_norm: True
         activation: "relu"
         rnn_type: "lstm"
         latent_dist: "normal"  #"normal" "categorical" "bernoulli"
         o_encoder:
            class: "MLPEncoder"
            d_x_encoded: 32
            lws: [ 32 ]
            layer_norm: True
            activation: "relu"
         o_decoder:
            class: "GaussianDecoder"
            lws: [ 32, 32 ]
            layer_norm: True
            activation: "relu"
            epsilon: 0.00001
         r_decoder:
            class: "GaussianDecoder"
            lws: [ 32, 32 ]
            layer_norm: True
            activation: "relu"
            epsilon: 0.00001
         term_decoder:
            class: "BinomialDecoder"
            lws: [ 32, 32 ]
            layer_norm: True
            activation: "relu"
      # RSSM no. 2
      -  d_z: 10
         d_h: 64
         d_a: 2
         n_hidden_layers: 3
         hidden_dropout: 0.1
         epsilon: 0.00001
         z_prior_lws: [ 64, 64 ]
         z_post_lws: [ 64, 64 ]
         layer_norm: True
         activation: "relu"
         rnn_type: "lstm"
         latent_dist: "normal"  #"normal" "categorical" "bernoulli"
         o_encoder:
            class: "MLPEncoder"
            lws: [ 32 ]
            layer_norm: True
            activation: "relu"
            d_x_encoded: 32
         o_decoder:
            class: "GaussianDecoder"
            lws: [ 32, 32 ]
            layer_norm: True
            activation: "relu"
            epsilon: 0.00001
         r_decoder:
            class: "GaussianDecoder"
            lws: [ 32, 32 ]
            layer_norm: True
            activation: "relu"
            epsilon: 0.00001
         term_decoder:
            class: "BinomialDecoder"
            lws: [ 32, 32 ]
            layer_norm: True
            activation: "relu"
   links: [ 'z' ]  # Links for observation filters between RSSM levels
   upwards_filters:
      # Connection between RSSM1 and RSSM2
      -  o:
            class: "PickOneUpwardsFilter"
            window_size: 2
            offset: -1
         #a:
         #   class: "LearnableUpwardsFilter"
         #   window_size: 2
         #   lws: [ 32, 32 ]
         #   layer_norm: True
         #   activation: "relu"
         #   model_type: "det_tanh"
         r:
            class: "AvgUpwardsFilter"
            window_size: 2
         terminal:
            class: "MaxUpwardsFilter"
            window_size: 2
   warmup_steps: [ 'rand', 'rand' ]
   kl_betas: [ 1.0, 1.0 ]
   kl_reg_betas: [ 0.0, 0.0 ]
   ema_regularization: 0.01
   ema_coeff: 0.95

optim:
   type: 'adam'  # 'adamW' 'adam'
   lr: 0.001 #0.0002

trainer:
   n_train_steps: 10000
   eval_interval: 20
   d_batch: 4096
   subtrajectory_len: 15
   collect_envs: 50
   collect_interval: 50
   agent_train_interval: 5
   agent_world_model_warmup: [ 2 , 1 ]
   agent_sim_steps: [ 25, 15 ]

eval:
   warmup_steps: [ 2, 1 ]
   eval_envs: 20
