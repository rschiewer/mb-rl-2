---
neptune_cfg: "../neptune_settings.yaml"
train_samples: "nav2d_VeryEasy_train.samples"
test_samples: "nav2d_VeryEasy_expert.samples"
checkpoint_path: "checkpoints"
final_model_path: "trained_models/model"

mdm:
   rssm_modules:
      # RSSM no. 1
      -  d_z: 10
         d_h: 64
         n_hidden_layers: 3
         hidden_dropout: 0.1
         epsilon: 0.00001
         z_prior_lws: [ 64, 64 ]
         z_post_lws: [ 64, 64 ]
         layer_norm: True
         activation: "relu"
         rnn_type: "lstm"
         latent_dist: "normal"  #"normal" "categorical" "bernoulli"
         o_encoder:
            class: "MLPEncoder"
            d_x_encoded: 32
            lws: [ 32 ]
            layer_norm: True
            activation: "relu"
         o_decoder:
            class: "GaussianDecoder"
            lws: [ 32, 32 ]
            layer_norm: True
            activation: "relu"
            epsilon: 0.00001
         r_decoder:
            class: "GaussianDecoder"
            lws: [ 32, 32 ]
            layer_norm: True
            activation: "relu"
            epsilon: 0.00001
         term_decoder:
            class: "BinomialDecoder"
            lws: [ 32, 32 ]
            layer_norm: True
            activation: "relu"
   links: [ ]
   upwards_filters: [ ]
   warmup_steps: [ 'rand' ]
   kl_betas: [ 1.0 ]
   kl_reg_betas: [ 0.001 ]
   ema_regularization: True

optim:
   type: 'adam'  # 'adamW' 'adam'
   lr: 0.001 #0.0002

trainer:
   n_train_steps: 3000
   eval_interval: 100
   d_batch: 1024
   pad_last_terminal_flag: False
   subtrajectory_len: 0
   collect_envs: 10
   collect_interval: 10

eval:
   warmup_steps: [ 2 ]
   eval_envs: 10
