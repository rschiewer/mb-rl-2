---
neptune_cfg: "../neptune_settings.yaml"
env_name: "PointMaze_UMaze-v3" #"PointMaze_UMaze_static-v3" #"InvertedPendulum-v4" #"dm_control/cheetah-run-v0"# "gym_nav2d:nav2dEasySparse-v0" #"HalfCheetah-v4"#"InvertedPendulum-v4" #"gym_nav2d:nav2dEasySparse-v0" #"gym_nav2d:nav2dEasy-v0" # "gym_nav2d:nav2dVeryEasy-v0"
prefill_memory: "random" #"offline-dataset" # "random", False
prefill_episodes: 100
train_samples: null #"nav2d_Easy_train.samples" #"nav2d_Easy_train.samples"
test_samples: null #"nav2d_EasySparse_expert.samples" #"nav2d_Easy_expert.samples"
checkpoint_path: "checkpoints"
final_model_path: "trained_models/model"
pretrained_model: null #"MBRL-2908"
repeat_terminal_state: False

mdm:
   rssm_modules:
      # RSSM no. 1
      -  d_z: 30
         d_h: 200
         d_a: <infer>
         d_s_embedding: 50
         s_embedding_lws: [128, 64, 32]
         n_hidden_layers: 1
         hidden_dropout: 0.1
         epsilon: 0.1
         z_prior_lws: [ 200 ]
         z_post_lws: [ 200 ]
         layer_norm: True
         activation: "relu"
         rnn_type: "gru"
         latent_dist: "normal"  #"normal" "categorical" "bernoulli"
         n_latent_categories: 16
         o_encoder:
            class: "MLPEncoder"
            d_x_encoded: 64
            lws: [ 100, 100, 100 ]
            layer_norm: True
            activation: "relu"
         o_decoder:
            class: "GaussianDecoder"
            lws: [ 100, 100, 100 ]
            layer_norm: True
            activation: "relu"
            epsilon: 0.1
         r_decoder:
            class: "GaussianDecoder"
            lws: [ 100, 100, 100 ]
            layer_norm: True
            activation: "relu"
            epsilon: 0.1
         term_decoder:
            class: "BinomialDecoder"
            lws: [ 100, 100, 100 ]
            layer_norm: True
            activation: "relu"
   links: [ ]  # Links for observation filters between RSSM levels
   upwards_filters: [ ]
   warmup_steps: [ 'rand' ]
   kl_betas: [ 0.5 ] #[ 0.1 ]
   kl_reg_betas: [ 0.0 ]
   ema_regularization: 0.0
   ema_coeff: 0.95
   ema_update_interval: 10
   latent_overshooting: [ ]
   temporal_activation_regularization: 1.0
   kl_balance: 0.8

optim:
   type: 'adam'  # 'adamW' 'adam'
   lr: 0.0002 #0.0002

trainer:
   n_train_steps: 6000
   freeze_model: False
   stop_collect: False
   eval_interval: 50
   d_batch: 128
   subtrajectory_len: 50
   collect_envs: 5
   collect_interval: 50
   agent_train_interval: 1
   model_train_steps: [ -1 ]
   agent_model_steps: [ 15 ]
   checkpoint_interval: 100
   sample_model_during_agent_training: True
   sample_agent_during_agent_training: True

agents:
   r_max:
      # level 0
      -  observation_type: 's_embedding'
         eps_exploration_init: 0.9
         eps_exploration_coeff: 0.9992
         eps_exploration_min: 0.0
         act_entropy_exploration_coeff: 0.0001
         learn_act_entropy_exploration_coeff: False
         novelty_exploration_coeff: 0.0
         tr_policy_kl_coeff: 0.1
         ema_update_coeff: 0.95
         lr_actor: 0.0001
         lr_critic: 0.0002
         min_scale: 0.1
         actor_lws: [ 100, 200, 100 ]
         critic_lws: [ 100, 200, 100 ]
         actor_act_fn: "relu"
         critic_act_fn: "relu"
         actor_layer_norm: True
         critic_layer_norm: True
         normalize_observations: False #'running_average'
         normalize_rewards: False #'running_average'
         dynamics_loss: True
         use_slow_value_target: True
         use_slow_world_model: False

eval:
   eval_envs: 20
   eval_steps: 1000
   warmup_steps: [ 3, 3 ]
